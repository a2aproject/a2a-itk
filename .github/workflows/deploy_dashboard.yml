name: Deploy ITK Dashboard

on:
  schedule:
    - cron: '0 4 * * *'       # Run daily at 4:00 AM UTC (2 hours after SDK nightly runs)
  workflow_dispatch:          # Allow manual trigger to refresh metrics instantly
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy_dashboard.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in progress for safety
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dashboard/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript natively, so `npm test` needs no build step.
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Fetch live nightly compatibility metrics
        run: |
          echo "Syncing latest interop logs from SDK rolling releases..."
          # Metrics land in public/ so Vite copies them verbatim into dist/.
          base=https://github.com/a2aproject
          fetch() {
            curl -L -f -o "public/$1" "$base/$2/releases/download/nightly-metrics/$3" \
              || echo "[]" > "public/$1"
          }
          fetch itk_python.json a2a-python itk_python.json
          fetch itk_go.json     a2a-go     itk_go.json
          fetch itk_rust.json   a2a-rs     itk_rust.json
          fetch itk_java.json   a2a-java   itk_java.json
          fetch itk_ts.json     a2a-js     itk_js.json
          echo "Metrics synchronized successfully!"

      - name: Build static site
        run: npm run build

      - name: Prepare static site structure
        run: |
          # The site is published under <pages-url>/dashboard/, so nest the
          # build output one level deep and upload only that.
          mkdir -p ../deploy_dist/dashboard
          cp -r dist/. ../deploy_dist/dashboard/
          echo "Site structure prepared under deploy_dist/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the temporary distribution directory to prevent exposing unwanted repo files
          path: 'deploy_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
