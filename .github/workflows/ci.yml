name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check --isolated test_suite tests scripts

      # The stubs in pyproto/ are committed. Regenerating them here catches an
      # edited proto or a moved A2A_SPEC_REF whose stubs were not committed.
      # The intent-to-add makes a generated file that was never committed show
      # up in the diff too.
      - name: Check generated stubs are up to date
        run: |
          ./build_protos.sh
          git add --intent-to-add pyproto
          git diff --exit-code -- pyproto

      - name: Run tests
        run: uv run pytest --tb=short
