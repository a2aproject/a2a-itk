# Combinations deliberately left out of every run.
#
# Applied to resolved scenarios just before they run; each is logged with its
# reason, because an exclusion nobody can see is indistinguishable from
# coverage that quietly disappeared. Where an exclusion names `agents`, that
# peer is removed from the graph and the scenario still runs; it is skipped
# only if fewer than two agents remain.
#
# This file is for combinations that are BROKEN. A line that cannot speak a
# transport from anywhere belongs in matrix.yaml's per-line `transports`,
# which also stops the peer being selected at all. Most entries here are v0.3
# interop, where the compat layer lives in whichever SDK drives the hop — so
# the limit is a property of the (SUT, peer) pair, which `sut_sdk` and
# `unless_sut_sdk` express and a per-line capability cannot.
#
# Fields (all optional except `reason`; those set must all match):
#   agents  transports  behaviors  streaming  sut_sdk  unless_sut_sdk
#   reason (required)   issue
#
# Every entry below was established by a real cross-SDK run. Add `issue:`
# once the defect has a tracking link.

exclusions:
  # ---------------------------------------------------------------------
  # a2a-rs has no v0.3 client support at all
  # ---------------------------------------------------------------------
  - sut_sdk: [rust]
    agents: [python_v03, go_v03, ts_v03]
    reason: >
      a2a-rs does not support v0.3 agents.

  # ---------------------------------------------------------------------
  # a2a-rs as SUT: REST SubscribeToTask is GET, some servers route only POST
  # ---------------------------------------------------------------------
  - sut_sdk: [rust]
    agents: [dotnet_v10]
    behaviors: [resubscribe]
    transports: [http_json]
    reason: >
      a2a-rs's REST client sends SubscribeToTask as GET /tasks/{id}:subscribe,
      the binding a2a.proto declares, and a2a-dotnet routes only POST for it.
      The GET matches dotnet's MapGet("/tasks/{id}") instead and becomes a
      GetTask for "<id>:subscribe", which 404s with TASK_NOT_FOUND. The Rust
      itk agent reads that 404 as the task having already completed and falls
      back to draining the original stream, but dotnet's itk agent holds a
      resubscribe task open until it is cancelled, so the stream never ends.
      The Rust SUT's SSE keep-alive stops the harness's read timeout from
      firing, so this one scenario ran a2a-rs's nightly into the 6h job limit
      every night from 2026-09-25. Over jsonrpc the same pair passes.

  - sut_sdk: [rust]
    agents: [java_v10]
    behaviors: [resubscribe]
    transports: [http_json]
    reason: >
      Same GET-versus-POST mismatch as the dotnet entry above, except that it
      fails silently instead of hanging. a2a-java's REST server routes only
      POST for /tasks/{id}:subscribe (A2AServerRoutes), so the GET gets 405;
      a2a-rs's client then retries the legacy /tasks/{id}/subscribe path,
      which java answers with 404. The Rust itk agent takes that 404 as the
      task having already completed and drains the original stream, and
      java's held task completes on its own after about 10s, so the scenario
      reports PASSED although no subscribe ever succeeded. Excluded so that
      green is not read as working resubscribe interop.

  # ---------------------------------------------------------------------
  # a2a-js as SUT: v0.3 peers over JSON-RPC only, unless the peer is also TS
  # ---------------------------------------------------------------------
  - sut_sdk: [ts]
    agents: [python_v03, go_v03]
    transports: [grpc, http_json]
    reason: >
      The TypeScript v0.3 compat layer handles JSON-RPC against other SDKs
      but not gRPC or HTTP+JSON. ts_v10 <-> ts_v03 works on all three and is
      deliberately not covered by this rule.

  # ---------------------------------------------------------------------
  # ts_v03 as a peer of anything that isn't TypeScript
  # ---------------------------------------------------------------------
  - agents: [ts_v03]
    transports: [grpc, http_json]
    unless_sut_sdk: [ts]
    reason: >
      The v0.3 compat layer for gRPC and HTTP+JSON is implemented properly
      only on the TypeScript side, so ts_v03 serves them to a TS counterpart
      but not to python, go, java or rust.

  # ---------------------------------------------------------------------
  # a2a-java's REST inbound path rejects a v0.3 file part
  # ---------------------------------------------------------------------
  - sut_sdk: [java]
    agents: [python_v03]
    transports: [http_json]
    reason: >
      On the return hop python v0.3 POSTs a REST file part carrying `name`,
      which is a legitimate v0.3 FilePart field. java's compat-0.3
      RestHandler_v0_3.parseRequestBody parses the body with protobuf
      JsonFormat against a2a.v1.FilePart, which has no such field, and the
      parser is strict — InvalidProtocolBufferException "Cannot find field:
      name in message a2a.v1.FilePart". Inbound REST only: jsonrpc and grpc
      pass against the same peer. This is the one combination that exposes
      it, because go_v03 has no http_json at all and ts_v03 over http_json is
      already excluded for non-TS SUTs.

  # ---------------------------------------------------------------------
  # gRPC between a2a-dotnet and every other SDK: interface URL format
  # ---------------------------------------------------------------------
  - sut_sdk: [dotnet]
    agents: [python_v10, go_v10, ts_v10, java_v10, rust_v10]
    transports: [grpc]
    reason: >
      .NET cannot dial any other SDK's gRPC endpoint, because every other SDK
      advertises it as a bare 127.0.0.1:<port> rather than an absolute URL.
      The v1.0.0 a2a.proto defines AgentInterface.url as an absolute URL,
      with "https://grpc.example.com/a2a" as its gRPC example, and the .NET
      itk agent follows it with http://127.0.0.1:<port>. python, go, ts and
      java advertise the bare address, and a2a-rs strips http:// from GRPC
      URLs on purpose. A2AClientFactory parses every interface URL with
      new Uri(...), which rejects a bare IP address with "Invalid URI: The
      URI scheme is not valid". The .NET gRPC binding itself works:
      current <-> dotnet_v10 passes send_message (both streaming modes) and
      resubscribe.

  - agents: [dotnet_v10]
    transports: [grpc]
    unless_sut_sdk: [dotnet]
    reason: >
      python, go, ts and java cannot dial dotnet_v10's gRPC endpoint, because
      their clients pass the advertised URL to the gRPC library as a raw dial
      target and cannot handle an absolute URL. dotnet_v10 advertises
      http://127.0.0.1:<port>, the form the v1.0.0 a2a.proto describes. The
      errors are "too many colons in address" (go), "Could not find a
      NameResolverProvider" (java), "Name resolution failed for target
      dns:http://..." (ts) and "Misformatted domain name" (python). a2a-rs's
      client accepts the scheme, so rust's outbound hop succeeds, but the
      return hop is .NET dialing rust's bare address, which fails as
      described above.

  # ---------------------------------------------------------------------
  # a2a-dotnet as SUT: push notifications are unimplemented
  # ---------------------------------------------------------------------
  - sut_sdk: [dotnet]
    behaviors: [push_notification]
    reason: >
      A2AServer answers every push-notification config operation —
      Create/Get/List/Delete — with PushNotificationNotSupported
      unconditionally; there is no option to turn it on. The agent card
      advertises pushNotifications=false to match, so ACTS skips its
      PUSH-* tests for the same reason.

  # ---------------------------------------------------------------------
  # a2a-dotnet as SUT: v0.3 peers over JSON-RPC only
  # ---------------------------------------------------------------------
  - sut_sdk: [dotnet]
    agents: [python_v03, go_v03, ts_v03]
    transports: [grpc, http_json]
    reason: >
      A2A.V0_3Compat ships a JSON-RPC server (MapA2AWithV03Compat) and a
      JSON-RPC client (V03CompatClientFactory, which wraps A2A.V0_3.A2AClient)
      and no REST or gRPC counterpart for either, so the itk agent advertises
      a v0.3 interface for JSONRPC only and throws NotSupportedException when
      told to call a v0.3 peer over anything else. The gRPC server implements
      only the v1.0 service and rejects an a2a-version of 0.3. Over jsonrpc
      the same peers pass.

  # ---------------------------------------------------------------------
  # a2a-dotnet as SUT: go_v03's send configuration omits acceptedOutputModes
  # ---------------------------------------------------------------------
  - sut_sdk: [dotnet]
    agents: [go_v03]
    reason: >
      On the return hop go v0.3 sends message/send with a `configuration`
      object that carries no `acceptedOutputModes`. .NET's
      A2A.V0_3.MessageSendConfiguration marks that property [JsonRequired], so
      System.Text.Json rejects the request before the handler sees it —
      "missing required properties". Same strictness class as a2a-dotnet#435,
      which relaxed AgentMessage.kind/messageId for this reason. python_v03
      passes over jsonrpc, so this is the go pairing specifically.

  # ---------------------------------------------------------------------
  # a2a-java calling a2a-dotnet over JSON-RPC: empty taskId/contextId
  # ---------------------------------------------------------------------
  - sut_sdk: [dotnet]
    agents: [java_v10]
    transports: [jsonrpc]
    reason: >
      java's JSON-RPC client sends message.taskId and message.contextId as
      empty strings, and a2a-dotnet adopts "" as the id of the task it
      creates, which java then rejects. JSONRPCUtils.toJsonRPCRequest prints
      the request with alwaysPrintFieldsWithNoPresence(), so unset fields go
      out as "". In a2a.proto task_id and context_id are plain strings with
      no presence, so "" means unset and the request is valid ProtoJSON.
      A2AServer.ResolveContextAsync checks IsNullOrEmpty only before looking
      up an existing task and otherwise falls through to `taskId ?? Guid...`,
      so the task comes back with id "" and contextId "", and java's
      ProtoUtils.FromProto.task fails with "Parameter 'id' may not be null".
      Here that is the return hop; dotnet -> java passes. http_json passes
      because java's REST client uses the plain JsonFormat.printer(), which
      omits unset fields. Treating an empty taskId/contextId as absent in
      ResolveContextAsync makes current <-> java_v10 pass over jsonrpc
      (send_message both modes, resubscribe).

  - sut_sdk: [java]
    agents: [dotnet_v10]
    transports: [jsonrpc]
    reason: >
      The same empty taskId/contextId defect as the entry above, on java's
      outbound hop: dotnet_v10 creates a task with id "" and java rejects it
      with "Parameter 'id' may not be null". All four jsonrpc variants
      (send_message both modes, push_notification, resubscribe) have failed
      in every a2a-java nightly since dotnet_v10 joined the matrix on
      2026-09-25; http_json passes.
