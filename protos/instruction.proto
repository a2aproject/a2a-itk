syntax = "proto3";

package itk;


message Instruction {
  // what should the "agent" do
  oneof step {
    CallAgent call_agent = 1;
    ReturnResponse return_response = 2;
    SeriesOfSteps steps = 3;
  }
}

// Behavior messages
message SendMessageBehavior {}
message PushNotificationBehavior {
  string url = 1;
  // A2A version to ask for in the push notification config
  string protocol_version = 2;
}
message ResubscribeBehavior {
  // whether to subscribe again from the last generation seen
  bool from_last_seen_generation = 1;
}

// Behaviors that need A2A 1.1 at both ends of the call.

// opens a live exchange and sends more requests on it
message LiveMessageBehavior {
  // how many messages to send after the one that opens the exchange
  int32 follow_ups = 1;
  // whether to also send one request that names another task
  bool foreign_task_request = 2;
}
// sends one client-written artifact with the instruction
message UserArtifactsBehavior {
  // text of the artifact
  string text = 1;
}
// answers a task that asks for input
message MultiTurnBehavior {
  // whether to first send one answer that names an outdated generation
  bool stale_attempt = 1;
}
// sends without waiting, then polls the task until it has finished
message LongPollBehavior {}

// gets the agent card from a remote agent, calls it and returns the response
message CallAgent {
  // which transport use to get agent card and later call
  string transport = 1;
  // where to get the agent card from
  string agent_card_uri = 2;
  // instruction for the called agent
  Instruction instruction = 3;
  // whether to use streaming
  bool streaming = 4;

  // behavior mode
  oneof behavior {
    SendMessageBehavior send_message = 5;
    PushNotificationBehavior push_notification = 6;
    ResubscribeBehavior resubscribe = 7;
    LiveMessageBehavior live_message = 8;
    UserArtifactsBehavior user_artifacts = 9;
    MultiTurnBehavior multi_turn = 10;
    LongPollBehavior long_poll = 11;
  }

  // A2A version to make the call at; empty means the one the SDK negotiates
  string protocol_version = 12;
}

// this option just returns a response
message ReturnResponse {
  // what to return to the calling agent
  string response = 1;
  // whether to hold the task in WORKING state instead of completing it
  bool hold_task = 2;
  // whether to add "served:<version>" to the response
  bool report_protocol_version = 3;
  // how long to keep the task in WORKING state before completing it, in ms
  int32 hold_ms = 4;
  // whether to ask for input before carrying out the instruction
  bool await_input = 5;
}

// executes step series and returns response based on response_generator
message SeriesOfSteps {
  repeated Instruction instructions = 1;

  enum ResponseGenerator {
    // default
    RESPONSE_GENERATOR_UNSPECIFIED = 0;
    RESPONSE_GENERATOR_CONCAT = 1;
  }

  ResponseGenerator response_generator = 2;
}
