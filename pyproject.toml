[project]
name = "itk"
version = "0.1.0"
description = "ITK Agent Interface and test orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio-tools>=1.60.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0",
    "grpcio>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "googleapis-common-protos>=1.60.0",
    "pyyaml>=6.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../.ruff.toml"
# Exclude generated files
exclude = [
    "**/pyproto/*.py",
]

[tool.ruff.lint.isort]
known-first-party = ["pyproto", "scripts", "test_suite"]


