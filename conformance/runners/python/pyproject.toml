[project]
name = "itk-conformance-runner-python"
version = "0.1.0"
description = "Wire-format conformance runner for a2a-python"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk @ git+https://github.com/a2aproject/a2a-python.git@v1.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
